[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinalyze-receiver"
version = "0.1.0"
description = "Coinalyze-only market data collector for pseudo footprint analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "like-kradness-2025" }]
dependencies = [
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "requests==2.34.2",
    "coinalyze==0.1.1",
    "pyrate-limiter<4.0.0",
]

[project.scripts]
coinalyze-receiver = "coinalyze_receiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
